apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otakuracy
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: otakuracy
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: k12.tail09959b.ts.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: otakuracy-api
            port:
              number: 9000
  tls:
  - hosts:
    - k12.tail09959b.ts.net
    secretName: tailscale-tls
