<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <meta name="theme-color" content="#7c6fff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}otakuracy{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f14;
      --surface: #1a1a24;
      --surface2: #242433;
      --border: #2e2e40;
      --accent: #7c6fff;
      --accent2: #ff6fa8;
      --text: #e8e8f0;
      --text-muted: #888899;
      --text-dim: #555566;
      --tag-bg: #252535;
      --tag-hover: #353548;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 2px 16px rgba(0,0,0,0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Nav */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .nav-logo span { color: var(--accent2); }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .nav-search-mini {
      margin-left: auto;
      max-width: 320px;
      width: 320px;
    }
    .nav-search-mini form {
      display: flex;
      gap: 0.5rem;
    }
    .nav-search-mini input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .nav-search-mini input:focus { border-color: var(--accent); }
    .nav-search-mini button {
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.15s;
    }
    .nav-search-mini button:hover { opacity: 0.85; }
    nav a.nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.15s;
    }
    nav a.nav-link:hover { color: var(--text); }

    /* Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Cards grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--accent);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: var(--surface2);
    }
    .card-img-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, var(--surface2), var(--surface));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--text-dim);
    }

    .card-body {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      margin-top: auto;
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .card-price {
      font-size: 0.8rem;
      color: var(--accent2);
      font-weight: 600;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.35rem;
    }

    /* Tags */
    .tag {
      display: inline-block;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.2rem 0.65rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .tag:hover {
      background: var(--tag-hover);
      color: var(--text);
    }
    .tag.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Status badge */
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-announced { background: #2a3a5e; color: #7ab0ff; }
    .badge-ongoing   { background: #1e3a2a; color: #5ecf8a; }
    .badge-ended     { background: #2e2e2e; color: #888; }

    /* Section headings */
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .section-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .section-header .count {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2.5rem;
    }
    .pagination a, .pagination span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 36px;
      padding: 0 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
    }
    .pagination a:hover { background: var(--surface2); color: var(--text); }
    .pagination span.current {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .pagination span.disabled { opacity: 0.3; cursor: default; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state p { font-size: 1rem; }

    /* Tag cloud */
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    /* Follow tag chips */
    .tag-chip {
      display:inline-flex;align-items:center;gap:0.3rem;
      background:var(--tag-bg);border:1px solid var(--border);border-radius:20px;
      padding:0.2rem 0.6rem;font-size:0.8rem;color:var(--text);
    }
    .tag-chip button {
      background:none;border:none;cursor:pointer;color:var(--text-muted);
      font-size:0.9rem;padding:0;line-height:1;
    }
    .tag-chip button:hover { color:var(--text); }
    .follow-btn {
      font-size:0.8rem;padding:0.25rem 0.6rem;border-radius:6px;
      border:1px solid var(--border);background:var(--surface2);
      color:var(--text-muted);cursor:pointer;transition:all 0.15s;white-space:nowrap;
    }
    .follow-btn:hover { border-color:var(--accent);color:var(--text); }
    .follow-btn.following { background:var(--accent);color:#fff;border-color:var(--accent); }

    /* Responsive */
    @media (max-width: 600px) {
      .nav-search-mini { display: none; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav>
  <a href="/" class="nav-logo">otaku<span>racy</span></a>
  <div class="nav-links">
    <a href="/" class="nav-link">ホーム</a>
    <a href="/events" class="nav-link">イベント</a>
    <a href="/mylist" class="nav-link">
      ★ マイリスト <span id="nav-bm-count" style="display:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 6px;font-size:0.75rem;margin-left:4px;"></span>
    </a>
  </div>
  <div class="nav-search-mini">
    <form action="/events" method="get">
      <input type="text" name="q" placeholder="🔍 検索...">
      <button type="submit">検索</button>
    </form>
  </div>
</nav>
<div id="tag-chip-bar" style="display:none;background:var(--surface);border-bottom:1px solid var(--border);padding:0.5rem 1.5rem;align-items:center;gap:0.5rem;flex-wrap:wrap;">
  <span style="font-size:0.8rem;color:var(--text-muted);white-space:nowrap;">フォロー中:</span>
  <div id="tag-chips" style="display:flex;gap:0.4rem;flex-wrap:wrap;"></div>
</div>

<main>
  {% block content %}{% endblock %}
</main>
<script>
const BM_KEY = 'otakuracy_bookmarks';
function bmLoad() { try { return JSON.parse(localStorage.getItem(BM_KEY) || '[]'); } catch { return []; } }
function bmSave(ids) { localStorage.setItem(BM_KEY, JSON.stringify(ids)); }
function bmHas(id) { return bmLoad().includes(id); }
function bmToggle(id) {
  let ids = bmLoad();
  if (ids.includes(id)) { ids = ids.filter(x => x !== id); }
  else { ids.push(id); }
  bmSave(ids);
  return ids.includes(id);
}
function bmUpdateNav() {
  const n = bmLoad().length;
  const el = document.getElementById('nav-bm-count');
  if (!el) return;
  el.textContent = n;
  el.style.display = n > 0 ? 'inline' : 'none';
}

const FT_KEY = 'otakuracy_followed_tags';
function ftLoad() { try { return JSON.parse(localStorage.getItem(FT_KEY) || '[]'); } catch { return []; } }
function ftSave(tags) { localStorage.setItem(FT_KEY, JSON.stringify(tags)); }
function ftHas(tag) { return ftLoad().includes(tag); }
function ftToggle(tag) {
  let tags = ftLoad();
  if (tags.includes(tag)) { tags = tags.filter(t => t !== tag); }
  else { tags.push(tag); }
  ftSave(tags);
  return tags.includes(tag);
}

function renderChipBar() {
  const tags = ftLoad();
  const bar = document.getElementById('tag-chip-bar');
  const container = document.getElementById('tag-chips');
  if (!bar || !container) return;
  container.innerHTML = '';
  if (tags.length === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  tags.forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = `${tag} <button onclick="ftUnfollow('${tag.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">&#215;</button>`;
    container.appendChild(chip);
  });
}

function ftUnfollow(tag) {
  ftToggle(tag);
  renderChipBar();
  if (location.pathname === '/events') applyFollowedFilter();
}

function applyFollowedFilter() {
  const tags = ftLoad();
  const params = new URLSearchParams(location.search);
  if (params.get('q') || params.get('tag')) return;
  if (tags.length === 0) {
    if (params.get('tags')) { params.delete('tags'); location.search = params.toString(); }
    return;
  }
  const current = params.get('tags') || '';
  const desired = tags.join(',');
  if (current !== desired) {
    params.set('tags', desired);
    params.set('page', '1');
    location.search = params.toString();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  bmUpdateNav();
  renderChipBar();
  if (location.pathname === '/events') applyFollowedFilter();
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
