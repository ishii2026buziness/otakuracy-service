{% extends "base.html" %}
{% block head %}
<style>
.bm-btn {
  background: none; border: none; cursor: pointer; font-size: 1.1rem;
  color: var(--text-muted); padding: 0; line-height: 1; flex-shrink: 0;
  transition: color 0.15s;
}
.bm-btn:hover, .bm-btn.active { color: #f5c542; }
</style>
{% endblock %}
{% block title %}otakuracy — イベントフィード{% endblock %}

{% block content %}
<div class="container" style="padding-top:1.5rem">

  <!-- サービス説明 -->
  <div style="background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1.75rem">
    <div style="font-size:1.1rem;font-weight:700;margin-bottom:0.3rem">アニメ・声優・ゲームのイベントをまとめてチェック</div>
    <div style="font-size:0.85rem;color:var(--text-muted)">タグをフォローして、気になるイベントをすぐ見つけよう</div>
  </div>

  <!-- 人気タグ -->
  <div style="margin-bottom:1.75rem">
    <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.6rem">人気タグ</div>
    <div id="popular-tags" style="display:flex;flex-wrap:wrap;gap:0.4rem"></div>
  </div>

  <!-- タブ + フィード -->
  <div>
    <div class="tabs">
      <button class="tab-btn" data-tab="all" onclick="switchTab('all')">すべて</button>
      <button class="tab-btn" data-tab="following" onclick="switchTab('following')">フォロー中 <span id="ft-count" style="font-size:0.75rem;color:var(--text-muted)"></span></button>
    </div>

    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;min-height:1.4rem">
      <span id="feed-count" style="font-size:0.85rem;color:var(--text-muted);display:none"></span>
      <a id="feed-more" href="/events" style="display:none;font-size:0.85rem;color:var(--accent);text-decoration:none;margin-left:auto">もっと見る →</a>
    </div>

    <div id="feed-grid" class="cards-grid"></div>
    <div id="feed-loading" style="text-align:center;padding:3rem 0;color:var(--text-muted)">読み込み中...</div>

    <!-- フォロー中タブ: タグ未設定時の空状態 -->
    <div id="feed-empty" style="display:none;padding:2rem 0">
      <p style="color:var(--text-muted);font-size:0.95rem;margin-bottom:1.25rem">
        タグをフォローすると、関連するイベントがここに表示されます。<br>
        ☆ を押してタグをフォローしてみましょう：
      </p>
      <div id="empty-popular-tags" style="display:flex;flex-wrap:wrap;gap:0.5rem"></div>
    </div>
  </div>

</div>

<script>
function fmtDate(v) {
  if (!v) return '日時未定';
  const d = v.split('T')[0], [y,m,dd] = d.split('-');
  return `${y}年${parseInt(m)}月${parseInt(dd)}日`;
}
function fmtPrice(min, max) {
  if (min == null && max == null) return '価格未定';
  if (min === max || max == null) return min ? `¥${Number(min).toLocaleString()}` : '無料';
  return `¥${Number(min).toLocaleString()} 〜 ¥${Number(max).toLocaleString()}`;
}
function bmToggleBtn(btn) {
  const id = btn.dataset.id;
  const added = bmToggle(id);
  btn.textContent = added ? '★' : '☆';
  btn.classList.toggle('active', added);
  bmUpdateNav();
}
function cardHtml(ev) {
  const bookmarked = bmHas(ev.event_id);
  return `<a href="/events/${ev.event_id}" class="card">
    ${ev.hero_image_url
      ? `<img class="card-img" src="${ev.hero_image_url}" alt="${ev.title}" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="card-img-placeholder">🎪</div>`}
    <div class="card-body">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem">
        <div class="card-title">${ev.title}</div>
        <button class="bm-btn" data-id="${ev.event_id}" onclick="event.preventDefault();event.stopPropagation();bmToggleBtn(this)" title="マイリストに追加">${bookmarked ? '★' : '☆'}</button>
      </div>
      <div class="card-meta">
        <div class="card-meta-row"><span>📅</span><span>${fmtDate(ev.start_at)}${ev.end_at && ev.end_at !== ev.start_at ? ' 〜 ' + fmtDate(ev.end_at) : ''}</span></div>
        ${ev.start_time ? `<div class="card-meta-row"><span>⏰</span><span>${ev.start_time} 〜${ev.end_time ? ' '+ev.end_time : ''}</span></div>` : ''}
        ${ev.venue_name ? `<div class="card-meta-row"><span>📍</span><span>${ev.venue_name}</span></div>` : ''}
        <div class="card-price">${fmtPrice(ev.price_min, ev.price_max)}</div>
      </div>
    </div>
  </a>`;
}

let popularTagsCache = [];

async function loadPopularTags() {
  const res = await fetch('/api/tags?limit=20');
  const data = await res.json();
  popularTagsCache = data.tags;

  // ナビ下の人気タグ欄
  const el = document.getElementById('popular-tags');
  if (el) {
    el.innerHTML = data.tags.map(t =>
      `<a href="/events?tag=${encodeURIComponent(t.keyword)}" class="tag">${t.keyword}</a>`
    ).join('');
  }
}

function renderEmptyStateTags() {
  const container = document.getElementById('empty-popular-tags');
  if (!container) return;
  container.innerHTML = popularTagsCache.map(t => {
    const following = ftHas(t.keyword);
    return `<span style="display:inline-flex;align-items:center;gap:0;background:var(--tag-bg);border:1px solid var(--border);border-radius:20px;overflow:hidden">
      <span style="padding:0.25rem 0.4rem 0.25rem 0.75rem;font-size:0.8rem;color:var(--text-muted)">${t.keyword}</span>
      <button onclick="emptyTagFollow(this,'${t.keyword.replace(/'/g, "\\'")}')"
        style="padding:0.25rem 0.65rem 0.25rem 0.2rem;background:none;border:none;cursor:pointer;font-size:0.85rem;transition:color 0.15s;color:${following ? '#f5c542' : 'var(--text-dim)'}"
        title="${following ? 'フォロー解除' : 'フォロー'}">${following ? '★' : '☆'}</button>
    </span>`;
  }).join('');
}

function emptyTagFollow(btn, tag) {
  const following = ftToggle(tag);
  btn.textContent = following ? '★' : '☆';
  btn.style.color = following ? '#f5c542' : 'var(--text-dim)';
  updateFtCount();
  if (following) {
    // タグをフォローしたのでフィードをリロード
    loadFeed('following');
  }
}

function updateFtCount() {
  const n = ftLoad().length;
  const el = document.getElementById('ft-count');
  if (el) el.textContent = n > 0 ? `(${n})` : '';
}

async function loadFeed(tab) {
  const loading = document.getElementById('feed-loading');
  const grid    = document.getElementById('feed-grid');
  const count   = document.getElementById('feed-count');
  const more    = document.getElementById('feed-more');
  const empty   = document.getElementById('feed-empty');

  grid.innerHTML = '';
  loading.style.display = '';
  empty.style.display = 'none';
  count.style.display = 'none';
  more.style.display = 'none';

  if (tab === 'following') {
    const tags = ftLoad();
    if (tags.length === 0) {
      loading.style.display = 'none';
      renderEmptyStateTags();
      empty.style.display = '';
      return;
    }
    const params = new URLSearchParams({ tags: tags.join(','), limit: 24, sort: 'near' });
    const res = await fetch(`/api/events?${params}`);
    const data = await res.json();
    loading.style.display = 'none';
    count.textContent = data.total + ' 件';
    count.style.display = '';
    more.href = `/events?tags=${encodeURIComponent(tags.join(','))}`;
    more.style.display = '';
    grid.innerHTML = data.items.map(cardHtml).join('');
  } else {
    const params = new URLSearchParams({ limit: 24, sort: 'near' });
    const res = await fetch(`/api/events?${params}`);
    const data = await res.json();
    loading.style.display = 'none';
    count.textContent = data.total + ' 件';
    count.style.display = '';
    more.href = '/events';
    more.style.display = '';
    grid.innerHTML = data.items.map(cardHtml).join('');
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  localStorage.setItem('otakuracy_home_tab', tab);
  loadFeed(tab);
}

document.addEventListener('DOMContentLoaded', async () => {
  updateFtCount();
  await loadPopularTags();
  const saved = localStorage.getItem('otakuracy_home_tab');
  const defaultTab = saved || (ftLoad().length > 0 ? 'following' : 'all');
  switchTab(defaultTab);
});
</script>
{% endblock %}
