{% extends "base.html" %}
{% block title %}otakuracy — アニメ・マンガ・VTuberイベント検索{% endblock %}

{% block head %}
<style>
  .hero {
    text-align: center;
    padding: 4rem 1.5rem 2rem;
  }
  .hero h1 {
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-bottom: 0.75rem;
  }
  .hero h1 .accent { color: var(--accent); }
  .hero h1 .accent2 { color: var(--accent2); }
  .hero p {
    color: var(--text-muted);
    font-size: 1.05rem;
    margin-bottom: 2rem;
  }
  .search-box {
    max-width: 600px;
    margin: 0 auto 2.5rem;
  }
  .search-box form {
    display: flex;
    gap: 0.75rem;
  }
  .search-box input[type="text"] {
    flex: 1;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 0.8rem 1.2rem;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input[type="text"]:focus {
    border-color: var(--accent);
  }
  .search-box button {
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    padding: 0.8rem 1.6rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .search-box button:hover { opacity: 0.85; }

  .tags-section {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }
  .tags-section h2 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
</style>
{% endblock %}

{% block content %}
<div class="hero">
  <h1><span class="accent">アニメ</span>・<span class="accent2">マンガ</span>・VTuberのイベントを探す</h1>
  <p>展示会・ライブ・舞台・コラボカフェまで一括検索</p>
  <div class="search-box">
    <form action="/events" method="get">
      <input type="text" name="q" placeholder="ハイキュー!!、ホロライブ、Ave Mujica...">
      <button type="submit">🔍 検索</button>
    </form>
  </div>
</div>

<div class="tags-section">
  <h2>人気タグ</h2>
  <div class="tag-cloud">
    {% for tag in tags %}
    <a href="/tags/{{ tag.keyword | urlencode }}" class="tag">
      {{ tag.keyword }} <span style="color:var(--text-dim)">{{ tag.event_count }}</span>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
