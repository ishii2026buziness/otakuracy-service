{% extends "base.html" %}
{% block title %}otakuracy — あなたのイベントフィード{% endblock %}

{% block content %}
<div class="container" style="padding-top:1.5rem">

  <!-- 人気タグ -->
  <div style="margin-bottom:2rem">
    <div class="section-header" style="margin-bottom:0.75rem">
      <h2 style="font-size:1rem;color:var(--text-muted)">人気タグ</h2>
    </div>
    <div id="popular-tags" style="overflow-x:auto;white-space:nowrap;padding-bottom:4px"></div>
  </div>

  <!-- ブックマークセクション（JS描画） -->
  <div id="bm-section" style="display:none;margin-bottom:2rem">
    <div class="section-header" style="margin-bottom:1rem">
      <h2 style="font-size:1.1rem">★ ブックマーク中</h2>
      <a href="/mylist" style="font-size:0.85rem;color:var(--accent);text-decoration:none;margin-left:auto">すべて見る →</a>
    </div>
    <div id="bm-mini-grid" class="cards-grid"></div>
  </div>

  <!-- フィード -->
  <div id="feed-section">
    <div class="section-header" style="margin-bottom:1rem">
      <h2 style="font-size:1.1rem" id="feed-title">読み込み中...</h2>
      <span class="count" id="feed-count" style="display:none"></span>
      <a href="/events" id="feed-more" style="display:none;font-size:0.85rem;color:var(--accent);text-decoration:none;margin-left:auto">もっと見る →</a>
    </div>
    <div id="feed-grid" class="cards-grid"></div>
    <div id="feed-loading" style="text-align:center;padding:3rem 0;color:var(--text-muted)">読み込み中...</div>
  </div>

</div>

<script>
function fmtDate(v) {
  if (!v) return '日時未定';
  const d = v.split('T')[0], [y,m,dd] = d.split('-');
  return `${y}年${parseInt(m)}月${parseInt(dd)}日`;
}
function fmtPrice(min, max) {
  if (min == null && max == null) return '価格未定';
  if (min === max || max == null) return min ? `¥${Number(min).toLocaleString()}` : '無料';
  return `¥${Number(min).toLocaleString()} 〜 ¥${Number(max).toLocaleString()}`;
}
function cardHtml(ev) {
  return `<a href="/events/${ev.event_id}" class="card">
    ${ev.hero_image_url
      ? `<img class="card-img" src="${ev.hero_image_url}" alt="${ev.title}" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="card-img-placeholder">🎪</div>`}
    <div class="card-body">
      <div class="card-title">${ev.title}</div>
      <div class="card-meta">
        <div class="card-meta-row"><span>📅</span><span>${fmtDate(ev.start_at)}${ev.end_at && ev.end_at !== ev.start_at ? ' 〜 ' + fmtDate(ev.end_at) : ''}</span></div>
        ${ev.start_time ? `<div class="card-meta-row"><span>⏰</span><span>${ev.start_time} 〜${ev.end_time ? ' '+ev.end_time : ''}</span></div>` : ''}
        ${ev.venue_name ? `<div class="card-meta-row"><span>📍</span><span>${ev.venue_name}</span></div>` : ''}
        <div class="card-price">${fmtPrice(ev.price_min, ev.price_max)}</div>
      </div>
    </div>
  </a>`;
}

async function loadPopularTags() {
  const res = await fetch('/api/tags?limit=20');
  const data = await res.json();
  const el = document.getElementById('popular-tags');
  if (!el) return;
  el.innerHTML = data.tags.map(t =>
    `<a href="/events?tag=${encodeURIComponent(t.keyword)}" class="tag" style="margin-right:0.4rem">${t.keyword}</a>`
  ).join('');
}

async function loadFeed() {
  const tags = ftLoad();
  const loading = document.getElementById('feed-loading');
  const title   = document.getElementById('feed-title');
  const grid    = document.getElementById('feed-grid');
  const count   = document.getElementById('feed-count');
  const more    = document.getElementById('feed-more');

  const params = tags.length > 0
    ? new URLSearchParams({ tags: tags.join(','), limit: 24, sort: 'near' })
    : new URLSearchParams({ limit: 24, sort: 'near' });

  title.textContent = tags.length > 0 ? 'フォロー中のイベント' : 'すべてのイベント';

  const res = await fetch(`/api/events?${params}`);
  const data = await res.json();
  loading.style.display = 'none';

  count.textContent = data.total + ' 件';
  count.style.display = '';
  more.style.display = '';
  if (tags.length > 0) {
    more.href = `/events?tags=${encodeURIComponent(tags.join(','))}`;
  }
  grid.innerHTML = data.items.map(cardHtml).join('');
}

async function loadBookmarks() {
  const ids = bmLoad();
  if (ids.length === 0) return;
  const section = document.getElementById('bm-section');
  const grid    = document.getElementById('bm-mini-grid');
  const results = await Promise.all(
    ids.slice(0, 4).map(id => fetch(`/api/events/${id}`).then(r => r.ok ? r.json() : null).catch(() => null))
  );
  const valid = results.filter(Boolean);
  if (valid.length === 0) return;
  section.style.display = 'block';
  grid.innerHTML = valid.map(cardHtml).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  loadPopularTags();
  loadBookmarks();
  loadFeed();
});
</script>
{% endblock %}
